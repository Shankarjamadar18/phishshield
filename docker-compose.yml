# Copy .env.example to .env to override credentials. Values below are local-dev defaults only.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phishshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phishshield}
      POSTGRES_DB: ${POSTGRES_DB:-phishshield}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./services/api
    restart: unless-stopped
    environment:
      # Inside Compose the database host is the service name "db", not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-phishshield}:${POSTGRES_PASSWORD:-phishshield}@db:5432/${POSTGRES_DB:-phishshield}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
