services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: phishshield
      POSTGRES_PASSWORD: phishshield
      POSTGRES_DB: phishshield
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishshield"]
      interval: 5s
      retries: 10
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://phishshield:phishshield@db:5432/phishshield
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
